[package]
name = "ds2-parquet"
authors = ["Radu Matei <radu@fermyon.com>"]
description = "A Rust function that transforms DataStream2 logs to the Parquet format"
version = "0.1.0"
rust-version = "1.78"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1"
arrow = "54.2.1"
chrono = "0.4"
http = "1.2.0"
parquet = "54.2.1"
rand = "0.9.0"
spin-sdk = "3.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace]

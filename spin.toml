spin_manifest_version = 2

[application]
name = "ds2-bridge"
version = "0.1.0"
authors = ["Radu Matei <radu@fermyon.com>"]
description = "A collection of serverless functions to process DataStream2 logs"

[variables]
# variables for accessing an S3-compatible storage
s3_bucket = { required = true }
s3_access_key_id = { required = true, secret = true }
s3_secret_access_key = { required = true, secret = true }
s3_region = { required = true }
s3_endpoint = { required = true }

[[trigger.http]]
# The route is a wildcard that matches any path under /api/v1/transform
# and will be used to route requests to the ds2-parquet component
route = "/api/v1/transform/..."
component = "ds2-parquet"

# The ds2-parquet component
[component.ds2-parquet]
# The Wasm component to instantiate and execute whenever a route that matches the request is hit
source = "ds2-parquet/target/wasm32-wasip1/release/ds2_parquet.wasm"
# The component does not make any outbound requests
allowed_outbound_hosts = ["https://s3-uploader.spin.internal"]

# The build command to compile the component
[component.ds2-parquet.build]
command = "cargo build --target wasm32-wasip1 --release"
workdir = "ds2-parquet"
watch = ["src/**/*.rs", "Cargo.toml"]

[[trigger.http]]
route = { private = true }
component = "s3-uploader"

[component.s3-uploader]
source = "s3-uploader/dist/s3-uploader.wasm"
allowed_outbound_hosts = ["https://ds2-bridge-demo.s3.us-east-1.amazonaws.com"]
[component.s3-uploader.variables]
s3_bucket = "{{s3_bucket}}"
s3_access_key_id = "{{s3_access_key_id}}"
s3_secret_access_key = "{{s3_secret_access_key}}"
s3_region = "{{s3_region}}"
s3_endpoint = "{{s3_endpoint}}"

[component.s3-uploader.build]
command = "npm install && npm run build"
workdir = "s3-uploader"
watch = ["src/**/*.ts", "package.json"]
